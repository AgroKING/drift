name: frontend
description: "Drift is a personal agent that scans a developer's GitHub, Linear, Slack, and Notion to find things they've been neglecting — PRs they haven't reviewed, Slack mentions they never replied to, sprint tasks with no Git activity, and contradictions between tools (task marked \"Done\" but PR still open)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  http: ^1.2.2
  google_fonts: ^6.0.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/mock_drift_report.json
    - assets/logo.png
    - assets/backgroundPattern.jpg
