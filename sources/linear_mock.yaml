name: linear_mock
version: "0.1.0"
dsl_version: 3
backend: jsonl
tables:
  - name: issues
    description: Mock Linear issues for Drift demo
    source:
      location: "file:////Users/milankc/proj/data/"
      glob: "linear_issues.jsonl"
    columns:
      - name: id
        type: Utf8
      - name: identifier
        type: Utf8
      - name: title
        type: Utf8
      - name: description
        type: Utf8
      - name: state_name
        type: Utf8
      - name: state_type
        type: Utf8
      - name: priority
        type: Int64
      - name: priority_label
        type: Utf8
      - name: assignee_name
        type: Utf8
      - name: assignee_email
        type: Utf8
      - name: creator_name
        type: Utf8
      - name: team_key
        type: Utf8
      - name: created_at
        type: Utf8
      - name: updated_at
        type: Utf8
      - name: started_at
        type: Utf8
        nullable: true
      - name: completed_at
        type: Utf8
        nullable: true
      - name: canceled_at
        type: Utf8
        nullable: true
      - name: due_date
        type: Utf8
        nullable: true
      - name: url
        type: Utf8
      - name: label_names
        type: Utf8
      - name: project_name
        type: Utf8
